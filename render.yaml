services:
  - type: web
    runtime: static
    name: visual-vibrations-loyalty-crm
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/client
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /partner
        destination: /partner.html
      - type: rewrite
        source: /assurance
        destination: /assurance.html
      - type: rewrite
        source: /compliance
        destination: /compliance.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
